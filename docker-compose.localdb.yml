# Surcharge pour tester avec une base MySQL locale dans Docker (la base externe n'est alors pas utilisée) :
#   docker compose -f docker-compose.yml -f docker-compose.localdb.yml up -d --build
# Variables nécessaires dans .env : DB_PASSWORD, MYSQL_ROOT_PASSWORD (+ celles de l'application). Ne pas définir DB_HOST / DB_NAME / DB_USER.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?définir MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: entraide
      MYSQL_USER: entraide
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Africa/Casablanca
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+01:00"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    depends_on:
      db:
        condition: service_healthy

  backup:
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
