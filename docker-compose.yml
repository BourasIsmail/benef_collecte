# Suivi des bénéficiaires : API Spring Boot + interface Next.js + sauvegarde, avec une base MySQL EXTERNE (voir .env).
# Seul le frontend est exposé ; l'API n'est joignable que depuis le réseau Docker.
#
# Base MySQL locale dans Docker (tests / développement) :
#   docker compose -f docker-compose.yml -f docker-compose.localdb.yml up -d --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://${DB_HOST:-db}:${DB_PORT:-3306}/${DB_NAME:-entraide}?${DB_PARAMS:-useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      DB_USER: ${DB_USER:-entraide}
      DB_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?définir APP_JWT_SECRET dans .env (32 caractères minimum)}
      APP_DEFAULT_PASSWORD: ${APP_DEFAULT_PASSWORD:?définir APP_DEFAULT_PASSWORD dans .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@entraide.ma}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_EMAIL_DOMAIN: ${APP_EMAIL_DOMAIN:-entraide.ma}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Sauvegarde quotidienne à 02:00 (mysqldump compressé, 14 jours conservés) dans ./backups
  backup:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${DB_HOST:-db}
      MYSQL_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${DB_NAME:-entraide}
      MYSQL_USER: ${DB_USER:-entraide}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Africa/Casablanca
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["bash", "/backup.sh"]
